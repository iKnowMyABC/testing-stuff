<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Season 2 Live Server Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0; height: 100%;
      background: #090d12;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      color: #c9d1d9;
      overflow: hidden;
    }

    #map { width: 100%; height: 100vh; background: #090d12; }

    /* Top HUD */
    .top-panel {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(13, 17, 23, 0.95);
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 6px 14px;
      display: flex;
      gap: 8px;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
    }

    .coord-field {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #090d13;
      border: 1px solid #30363d;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .coord-field span { font-weight: 700; color: #58a6ff; font-size: 11px; }
    .coord-field input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      width: 48px;
      font-weight: 600;
      font-size: 13px;
      font-family: monospace;
    }

    select.type-select {
      background: #090d13;
      border: 1px solid #30363d;
      color: #fff;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 12px;
      outline: none;
    }

    .btn-action {
      background: #238636;
      border: 1px solid #2ea043;
      color: #fff;
      padding: 6px 12px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-action:hover { background: #2ea043; }

    .btn-secondary {
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-secondary:hover { background: #30363d; color: #fff; }

    .hud-coords {
      position: absolute;
      bottom: 15px;
      right: 15px;
      z-index: 1000;
      background: rgba(13, 17, 23, 0.9);
      border: 1px solid #30363d;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-family: monospace;
      color: #8b949e;
      pointer-events: none;
    }
    .hud-coords b { color: #58a6ff; }

    #status-msg {
      position: absolute;
      top: 66px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 4px;
      display: none;
      font-weight: 600;
    }
    .msg-error { background: #da3633; color: #fff; border: 1px solid #f85149; }
    .msg-info { background: #1f6feb; color: #fff; }
    .msg-success { background: #238636; color: #fff; border: 1px solid #2ea043; }

    /* Radar Pins */
    .stronghold-pin {
      border-radius: 50%;
      border: 1.5px solid #ffffff;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.95);
      transition: transform 0.1s ease, opacity 0.2s ease;
    }
    .stronghold-pin:hover {
      transform: scale(1.6);
      z-index: 9999 !important;
    }

    /* Globally Marked as Found */
    .stronghold-pin.is-found {
      opacity: 0.22 !important;
      border-color: #484f58 !important;
      filter: grayscale(100%);
    }

    /* Popup Action Button */
    .popup-found-btn {
      display: inline-block;
      width: 100%;
      margin-top: 8px;
      padding: 6px 0;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      border-radius: 4px;
      text-decoration: none;
      cursor: pointer;
    }
    .btn-mark { background: #238636; color: #fff; }
    .btn-mark:hover { background: #2ea043; }
    .btn-view { background: #30363d; color: #58a6ff; }
  </style>
</head>
<body>

  <div class="top-panel">
    <div class="coord-field">
      <span>X</span>
      <input type="number" id="input-x" placeholder="0" min="0" max="1000" />
    </div>
    <div class="coord-field">
      <span>Y</span>
      <input type="number" id="input-y" placeholder="0" min="0" max="1000" />
    </div>

    <select id="input-type" class="type-select">
      <option value="Level 1">Level 1</option>
      <option value="Level 2">Level 2</option>
      <option value="Level 3">Level 3</option>
      <option value="Level 4">Level 4</option>
      <option value="Level 5">Level 5</option>
      <option value="Level 6">Level 6</option>
      <option value="Level 7">Level 7</option>
      <option value="Custom Spot">Custom Spot</option>
    </select>

    <button class="btn-action" onclick="submitCoordinate()">Submit / Mark</button>
    <button class="btn-secondary" id="toggle-found-btn" onclick="toggleHideFound()">Hide Found</button>
  </div>

  <div class="hud-coords" id="hud-coords">X: 0 | Y: 0</div>
  <div id="status-msg"></div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const REPO_OWNER = "iKnowMyABC"; // <-- Your GitHub handle
    const REPO_NAME = "testing-stuff";
    const MAP_LIMIT = 1000;

    const registeredCoords = new Map();
    const markerInstances = new Map(); 
    const globalFoundCoords = new Map();
    let hideFoundActive = false;

    const map = L.map('map', {
      crs: L.CRS.Simple,
      minZoom: -1.5,
      maxZoom: 3,
      zoomSnap: 0.25,
      zoomDelta: 0.5,
      attributionControl: false
    });

    const bounds = [[0, 0], [MAP_LIMIT, MAP_LIMIT]];
    L.imageOverlay('season-2-grid.png', bounds).addTo(map);
    map.fitBounds(bounds);

    map.on('mousemove', (e) => {
      const x = Math.round(e.latlng.lng);
      const y = Math.round(e.latlng.lat);
      if (x >= 0 && x <= MAP_LIMIT && y >= 0 && y <= MAP_LIMIT) {
        document.getElementById('hud-coords').innerHTML = `X: <b>${x}</b> | Y: <b>${y}</b>`;
      }
    });

    function showStatus(text, type = 'info') {
      const box = document.getElementById('status-msg');
      box.className = type === 'error' ? 'msg-error' : (type === 'success' ? 'msg-success' : 'msg-info');
      box.textContent = text;
      box.style.display = 'block';
      setTimeout(() => { box.style.display = 'none'; }, 4500);
    }

    function generateFoundUrl(data) {
      const title = `[FOUND] ${data.label} at (${data.x}, ${data.y})`;
      const rawData = JSON.stringify({ x: data.x, y: data.y, type: data.label });
      const body = `Marking supply found for global server.\n\n<!--DATA:${rawData}-->\n\n- **X:** ${data.x}\n- **Y:** ${data.y}\n- **Supply:** ${data.label}`;
      return `https://github.com/${REPO_OWNER}/${REPO_NAME}/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}&labels=supply-found`;
    }

    function updateMarkerVisual(marker, key, data) {
      const isFound = globalFoundCoords.has(key);
      const foundData = globalFoundCoords.get(key);

      const icon = L.divIcon({
        className: `stronghold-pin ${isFound ? 'is-found' : ''}`,
        html: `<div style="width:100%;height:100%;background:${data.color};border-radius:50%;"></div>`,
        iconSize: [11, 11],
        iconAnchor: [5.5, 5.5]
      });
      marker.setIcon(icon);

      let actionBtn = "";
      if (isFound) {
        actionBtn = `
          <div style="margin-top:6px; color:#3fb950; font-weight:700;">✅ Found by Community</div>
          <a class="popup-found-btn btn-view" href="${foundData.url}" target="_blank">View GitHub Report</a>
        `;
      } else {
        const markUrl = generateFoundUrl(data);
        actionBtn = `
          <a class="popup-found-btn btn-mark" href="${markUrl}" target="_blank">Mark Found for Everyone</a>
        `;
      }

      const popupHtml = `
        <div style="color: #111; font-size: 12px; font-family: -apple-system, sans-serif; min-width: 150px;">
          <strong style="color:${data.color === '#00FF00' ? '#008800' : data.color}; font-size:13px;">${data.label}</strong><br/>
          <span>Coords: <b>(${data.x}, ${data.y})</b></span><br/>
          ${actionBtn}
        </div>
      `;
      marker.bindPopup(popupHtml);

      if (hideFoundActive && isFound) {
        marker.setOpacity(0);
      } else {
        marker.setOpacity(1);
      }
    }

    function createPin(x, y, label, color) {
      const key = `${x},${y}`;
      const marker = L.marker([y, x]).addTo(map);

      markerInstances.set(key, marker);
      updateMarkerVisual(marker, key, { x, y, label, color });
      return marker;
    }

    window.toggleHideFound = function() {
      hideFoundActive = !hideFoundActive;
      const btn = document.getElementById('toggle-found-btn');
      btn.textContent = hideFoundActive ? "Show Found" : "Hide Found";
      btn.style.borderColor = hideFoundActive ? "#58a6ff" : "#30363d";

      markerInstances.forEach((marker, key) => {
        if (globalFoundCoords.has(key)) {
          marker.setOpacity(hideFoundActive ? 0 : 1);
        }
      });
    };

    async function loadFoundStatus() {
      const endpoint = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/issues?labels=supply-found&state=open&per_page=100`;
      try {
        const res = await fetch(endpoint);
        if (!res.ok) return;
        const issues = await res.json();

        issues.forEach(issue => {
          const match = issue.body.match(/<!--DATA:({.*?})-->/);
          if (match) {
            try {
              const data = JSON.parse(match[1]);
              const key = `${data.x},${data.y}`;
              globalFoundCoords.set(key, { url: issue.html_url });
            } catch (e) {}
          }
        });
      } catch (err) {
        console.error("Could not fetch global found status:", err);
      }
    }

    async function loadStaticData() {
      try {
        const res = await fetch('data.json');
        if (!res.ok) return;
        const data = await res.json();

        if (data.strongholds) {
          data.strongholds.forEach(group => {
            group.coordinates.forEach(pt => {
              const key = `${pt.x},${pt.y}`;
              registeredCoords.set(key, {
                x: pt.x,
                y: pt.y,
                label: group.label,
                level: group.level,
                color: group.color
              });
              createPin(pt.x, pt.y, group.label, group.color);
            });
          });
        }
      } catch (err) {
        console.error("Error reading data.json:", err);
      }
    }

    async function loadCommunityMarkers() {
      const endpoint = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/issues?labels=map-marker&state=open&per_page=100`;
      try {
        const res = await fetch(endpoint);
        if (!res.ok) return;
        const issues = await res.json();

        issues.forEach(issue => {
          const match = issue.body.match(/<!--DATA:({.*?})-->/);
          if (match) {
            try {
              const data = JSON.parse(match[1]);
              const key = `${data.x},${data.y}`;
              registeredCoords.set(key, { x: data.x, y: data.y, label: data.type || issue.title, color: '#ffffff' });
              createPin(data.x, data.y, data.type || issue.title, '#ffffff');
            } catch (e) {}
          }
        });
      } catch (err) {}
    }

    async function init() {
      await loadFoundStatus();
      await loadStaticData();
      await loadCommunityMarkers();

      markerInstances.forEach((marker, key) => {
        const data = registeredCoords.get(key);
        if (data) updateMarkerVisual(marker, key, data);
      });
    }
    init();

    // --- Unified Search, Mark-Found & Add Logic ---
    function submitCoordinate() {
      const x = parseInt(document.getElementById('input-x').value, 10);
      const y = parseInt(document.getElementById('input-y').value, 10);
      const type = document.getElementById('input-type').value;

      if (isNaN(x) || isNaN(y)) {
        showStatus("Please enter both X and Y coordinates.", 'error');
        return;
      }

      const key = `${x},${y}`;

      // CASE 1: Coordinate already exists on our map
      if (registeredCoords.has(key)) {
        const existing = registeredCoords.get(key);
        const marker = markerInstances.get(key);
        map.flyTo([y, x], 2);

        if (marker) marker.openPopup();

        // 1A: Already claimed by someone
        if (globalFoundCoords.has(key)) {
          showStatus(`Already collected! "${existing.label}" at (${x}, ${y}) was already marked found.`, 'error');
          return;
        }

        // 1B: Known supply, ready to be marked as found
        showStatus(`Matched ${existing.label}! Redirecting to mark it found for everyone...`, 'success');
        const markUrl = generateFoundUrl(existing);
        window.open(markUrl, '_blank');
        return;
      }

      // CASE 2: Brand new coordinate (add new spot)
      map.flyTo([y, x], 1.6);
      showStatus(`New location! Redirecting to add (${x}, ${y}) to the map...`, 'info');

      const title = `${type} at (${x}, ${y})`;
      const rawData = JSON.stringify({ x, y, type });
      const body = `Community Coordinate Submission\n\n<!--DATA:${rawData}-->\n\n- **X:** ${x}\n- **Y:** ${y}\n- **Type:** ${type}`;
      const submitUrl = `https://github.com/${REPO_OWNER}/${REPO_NAME}/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}&labels=map-marker`;

      window.open(submitUrl, '_blank');
    }
  </script>
</body>
</html>
